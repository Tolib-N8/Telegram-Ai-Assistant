<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Telegram Assistant Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@github/webauthn-json@latest/dist/browser-global/webauthn-json.browser-global.min.js"></script>
</head>

<body>
    <div class="bg-mesh"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <main class="login-wrap">
        <section class="login-card">
            <div class="login-brand">
                <div class="login-brand__glyph" aria-hidden="true">
                    <img class="logo-mark" src="/static/icons/logo.svg" alt="">
                </div>
                <div>
                    <div class="login-brand__title">AI Assistant</div>
                    <div class="login-brand__sub">Secure Dashboard</div>
                </div>
            </div>

            <h2 class="login-title">Вход</h2>
            <p class="login-subtitle">Управляйте своим ассистентом и аккаунтами</p>

            <form id="loginForm" class="login-form">
                <div class="field">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" class="input-fancy" placeholder="admin" required>
                </div>
                <div class="field">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" class="input-fancy" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Войти <i data-lucide="arrow-right"></i>
                </button>
            </form>

            <div class="divider"><span>или</span></div>

            <button id="passkeyLogin" class="btn btn-ghost btn-block">
                Passkey <i data-lucide="fingerprint"></i>
            </button>

            <div id="error" class="error-msg" role="alert">Неверный логин или пароль</div>
        </section>
    </main>

    <script>
        lucide.createIcons();

        const form = document.getElementById('loginForm');
        const passkeyBtn = document.getElementById('passkeyLogin');
        const errorDiv = document.getElementById('error');

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errorDiv.innerText = "Неверный логин или пароль";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = "Ошибка сервера при входе";
                errorDiv.style.display = 'block';
            }
        };

        passkeyBtn.onclick = async () => {
            errorDiv.style.display = 'none';
            const username = document.getElementById('username').value;

            try {
                // Get options
                const optRes = await fetch('/api/auth/login/options', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(username ? { username } : {})
                });

                if (!optRes.ok) {
                    const errData = await optRes.json();
                    errorDiv.innerText = errData.message || "У этого пользователя нет Passkeys";
                    errorDiv.style.display = 'block';
                    return;
                }

                const options = await optRes.json();
                const loginId = options.login_id;
                if (!loginId) {
                    errorDiv.innerText = "Ошибка: отсутствует login_id";
                    errorDiv.style.display = 'block';
                    return;
                }

                // Native authentication call (using webauthn-json helper)
                const credential = await webauthnJSON.get({ publicKey: options });

                // Verify
                const verRes = await fetch('/api/auth/login/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login_id: loginId, ...(username ? { username } : {}), ...credential })
                });

                if (verRes.ok) {
                    window.location.href = '/';
                } else {
                    errorDiv.innerText = "Ошибка верификации Passkey";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                if (err.name !== 'NotAllowedError') { // Common if user cancels
                    errorDiv.innerText = "Ошибка при использовании Passkey";
                    errorDiv.style.display = 'block';
                }
            }
        };
    </script>
</body>

</html>
